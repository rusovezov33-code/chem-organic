<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Органическая химия</title>
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Органика">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Органическая и биоорганическая химия (РУДН, 1 курс) — уроки, повторение, пробная КР. Работает офлайн.">
<style>
:root{
  --bg:#f6f6f3;--surface:#ffffff;--surface2:#f0f0ec;--line:#e4e4df;--text:#1f2120;--muted:#6f726f;
  --accent:#5b5bd6;--accent-ink:#ffffff;--accent-soft:#ececfb;--accent-dark:#4a3fc0;
  --bad:#c8493f;--bad-soft:#fbe9e7;--warn:#d98a1c;--lat:#3d3db0;
  --radius:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121413;--surface:#1b1e1c;--surface2:#232725;--line:#2e3330;--text:#ebecea;--muted:#9aa09c;
  --accent:#8f8ff5;--accent-ink:#11112a;--accent-soft:#26264d;--accent-dark:#6d6de0;--bad:#e2685e;--bad-soft:#3a2220;--lat:#b9b9ff;
  --shadow:none;}}
:root[data-theme=dark]{
  --bg:#121413;--surface:#1b1e1c;--surface2:#232725;--line:#2e3330;--text:#ebecea;--muted:#9aa09c;
  --accent:#8f8ff5;--accent-ink:#11112a;--accent-soft:#26264d;--accent-dark:#6d6de0;--bad:#e2685e;--bad-soft:#3a2220;--lat:#b9b9ff;
  --shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.lat{font-family:var(--serif);color:var(--lat)}
.muted{color:var(--muted)}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.streak{color:var(--warn)} .pill.streak.off{color:var(--muted)}
.pill.xp{color:var(--accent)}
.content{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(84px + var(--safe-b))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:.75rem;color:var(--muted);font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
h2.sec{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dark);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:40px;font-size:.9rem;padding:0 14px;width:auto}

/* ---------- home ---------- */
.home{display:grid;gap:16px}
.hero{padding:18px;display:grid;gap:14px}
.hero .goal{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--surface2)} .ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.goal b{display:block;font-size:1.05rem}
.next-title{font-size:.85rem;color:var(--muted)}
.hero-actions{display:grid;gap:10px}
.hero .review-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero .review-line b{font-size:1.05rem}
.storage-warn{padding:12px 14px;font-size:.88rem;background:var(--bad-soft);border-color:transparent;color:var(--text)}
.units{display:grid;gap:12px}
.unit{padding:16px}
.unit-head{display:flex;align-items:baseline;gap:10px}
.unit-head h3{margin:0;font-size:1.05rem;flex:1}
.unit-head .cnt{font-size:.85rem;color:var(--muted);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.lesson-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.lesson-dot{flex:none;padding:0}.lesson-dot svg{width:20px;height:20px}
.card.search{min-width:0}.card.search input{min-width:0;width:100%}
.lesson-dot.passed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lesson-dot.passed.learning{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lesson-dot.next{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lesson-dot:active{transform:scale(.95)}

/* ---------- dictionary ---------- */
.dict-tools{display:grid;gap:10px;position:sticky;top:calc(57px + var(--safe-t));z-index:3;background:var(--bg);padding:4px 0 10px}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px}
.search input{flex:1;border:0;background:none;outline:none;font-size:1rem;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dict-list{display:grid;gap:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t .lat{font-size:1.08rem}
.row .t .ru{font-size:.92rem;color:var(--muted)}
.row .t .nt{font-size:.8rem;color:var(--muted);font-style:italic}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface2)}
.dots i.f{background:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--surface2)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding:16px 16px 10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--muted)}
.week div i{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--surface2);min-height:4px}
.week div i.f{background:var(--accent)}
.settings{overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-height:58px}
.set:first-child{border-top:0}
.set label,.set .lbl{flex:1}
.set small{display:block;color:var(--muted);font-size:.8rem}
.set select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:52%}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(20px)}
.set-actions{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}

/* ---------- session (lesson) ---------- */
.session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.s-top{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--safe-t)) 16px 8px;max-width:820px;width:100%;margin:0 auto}
.s-prog{flex:1;height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:7px;transition:width .35s ease}
.s-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto;padding:12px 20px 20px}
.q-kind{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 6px}
.q-title{font-size:1.35rem;font-weight:700;margin:0 0 18px}
.prompt{display:flex;align-items:center;gap:12px;margin:4px 0 22px;flex-wrap:wrap}
.prompt .big{font-size:2rem;line-height:1.2;word-break:break-word}
.prompt .big.ru{font-family:var(--sans);color:var(--text);font-weight:650}
.prompt .gram{font-size:1rem;color:var(--muted);font-family:var(--serif)}
.speak{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.speak svg{width:24px;height:24px}
.speak:active{transform:scale(.95)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:12px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.05rem;transition:transform .06s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.78rem;color:var(--muted);font-weight:700}
.opt.lat-opt{font-family:var(--serif);color:var(--lat);font-size:1.12rem}
.opt.right{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt.dim{opacity:.5}
.opts.locked .opt{pointer-events:none}
.intro{padding:26px 22px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:8px}
.intro .badge{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.intro .lat{font-size:2.3rem;line-height:1.15}
.intro .gram{font-family:var(--serif);color:var(--muted);font-size:1.1rem}
.intro .ru{font-size:1.3rem;font-weight:650}
.intro .nt{font-size:.92rem;color:var(--muted)}
.type-wrap{display:grid;gap:10px}
.type-in{width:100%;height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font-size:1.3rem;font-family:var(--serif);color:var(--lat);outline:none}
.type-in:focus{border-color:var(--accent)}
.type-in.right{border-color:var(--accent);background:var(--accent-soft)}
.type-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.88rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;min-height:56px;padding:10px}
.match .opt.sel{border-color:var(--lat);box-shadow:0 3px 0 var(--lat)}
.match .opt.gone{opacity:.28;pointer-events:none;box-shadow:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.s-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px 20px calc(14px + var(--safe-b))}
.s-foot .in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.s-foot.ok{background:var(--accent-soft);border-color:transparent}
.s-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.s-foot.ok .fb .ic{background:var(--accent)} .s-foot.bad .fb .ic{background:var(--bad)}
.fb b{display:block;font-size:1.1rem}
.s-foot.ok .fb b{color:var(--accent-dark)} .s-foot.bad .fb b{color:var(--bad)}
.fb .ans{font-size:1rem;margin-top:2px}
.fb .ans .lat{font-size:1.08rem}
.s-foot .row2{display:flex;gap:10px}
.s-foot .row2 .btn.ghost{flex:0 0 auto;width:auto}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
/* flashcards */
.flash{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.fcard{min-height:260px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;user-select:none}
.fcard .lat{font-size:2.1rem;line-height:1.2}
.fcard .gram{font-family:var(--serif);color:var(--muted)}
.fcard .ru{font-size:1.35rem;font-weight:650}
.fcard .tap{font-size:.85rem;color:var(--muted)}
/* done screen */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0}
.done .seal{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.done .seal svg{width:52px;height:52px;stroke-width:3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done h2{margin:0;font-size:1.8rem}
.done p{margin:0;color:var(--muted)}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.done-stats .stat{text-align:center;padding:14px 8px}
.done-stats .stat b{font-size:1.45rem}
.streak-note{font-weight:700;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- tablet & wide ---------- */
@media (min-width:600px){
  .opts.two{grid-template-columns:1fr 1fr}
  .prompt .big{font-size:2.4rem}
  .intro .lat{font-size:2.8rem}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:768px){
  html,body{font-size:17px}
  .content{padding:24px 28px calc(28px + var(--safe-b))}
  .tabbar{position:sticky;top:0;bottom:auto;left:auto;right:auto;order:-1;background:none;border:0;padding:0;gap:4px;width:auto}
  .tabbar button{flex-direction:row;gap:8px;font-size:.92rem;padding:8px 14px;border-radius:10px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button.on{background:var(--accent-soft)}
  .topbar{padding-left:28px;padding-right:28px}
  .tabslot{display:flex}
  .units{grid-template-columns:1fr 1fr}
  .home{grid-template-columns:minmax(280px,340px) 1fr;align-items:start;gap:24px}
  .home .side{position:sticky;top:calc(84px + var(--safe-t));display:grid;gap:16px}
  .home .side h2.sec:first-child{margin-top:0}
  .home .main h2.sec:first-child{margin-top:0}
  .dict-tools{top:calc(65px + var(--safe-t))}
  .dict-list{grid-template-columns:1fr 1fr}
  .dict-list .row:nth-child(2){border-top:0}
  .dict-list .row:nth-child(odd){border-right:1px solid var(--line)}
  .s-body{padding:28px 32px}
  .q-title{font-size:1.6rem}
  .opt{min-height:64px;font-size:1.12rem}
  .toast{bottom:32px}
  .stats-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .stats-layout h2.sec:first-child{margin-top:0}
}
@media (min-width:768px) and (max-width:899px) and (orientation:portrait){
  .home{grid-template-columns:1fr}
  .home .side{position:static;grid-template-columns:1fr 1fr;align-items:start}
  .home .side h2.sec{grid-column:1/-1}
}
@media (min-width:1100px){ .units{grid-template-columns:1fr 1fr} }
@media (max-height:520px) and (orientation:landscape){
  .prompt{margin-bottom:12px} .q-title{margin-bottom:10px} .opts.two,.opts{grid-template-columns:1fr 1fr} .opt{min-height:50px}
  .intro{padding:14px} .done .seal{width:64px;height:64px}
}
@media (min-width:768px) and (max-width:900px){ .brand span{display:none} }
@media (max-width:400px){ #flashBtn span{display:none} }
@media (max-width:370px){ .brand span{display:none} .prompt .big{font-size:1.7rem} .lesson-dot{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- chemistry additions ---------- */
.f{font-family:var(--sans)}
sub,sup{font-size:.72em;line-height:0}
.arr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .25em;line-height:1}
.arr small{font-size:.62em;color:var(--muted);white-space:nowrap;margin-bottom:-.15em}
.qbox{font-size:1.25rem;line-height:1.45;font-weight:650;margin:2px 0 20px;word-break:break-word}
.qbox.eq{font-size:1.2rem;font-weight:600}
.exp{font-size:.92rem;color:var(--text);opacity:.9;margin-top:6px}
.srcl{font-size:.78rem;color:var(--muted);margin-top:4px}
.chainv{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;justify-content:center}
.chainv .nd{padding:4px 8px;border-radius:8px;background:var(--surface2);font-weight:650}
.chainv .nd.gap{background:var(--accent-soft);color:var(--accent);min-width:44px;text-align:center}
.rankv{display:grid;gap:6px;text-align:left}
.rankv div{display:flex;gap:8px;align-items:baseline}
.rankv i{font-style:normal;color:var(--muted);font-weight:700;min-width:1.4em}
.tf-stmt{padding:16px;margin:0 0 18px;font-size:1.08rem;line-height:1.45}
.tf-stmt .lbl{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.order-ans{min-height:64px;display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px}
.order-ans:empty:before{content:"Нажимайте варианты по порядку";color:var(--muted);font-size:.9rem;padding:8px}
.order-ans .opt,.order-pool .opt{min-height:50px;font-size:1rem}
.order-pool{display:grid;gap:8px}
.opt .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.exam-card{padding:16px;display:grid;gap:10px;border-color:var(--accent)}
.exam-card .dl{font-size:1.6rem;font-weight:800;color:var(--accent)}
.badge2{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.row .t .a{font-size:.95rem;margin-top:2px}
.row .t .q{font-weight:650}
.intro .q{font-size:1.4rem;font-weight:700;line-height:1.35}
.intro .ans{font-size:1.2rem;font-weight:650;color:var(--accent)}
.fcard .q{font-size:1.4rem;font-weight:700}
.fcard .ans{font-size:1.15rem;font-weight:650;color:var(--accent)}
.match .opt{font-size:.95rem}
.dict-list{grid-template-columns:1fr!important}
.dict-list .row{border-right:0!important}
.dict-list .row:nth-child(2){border-top:1px solid var(--line)!important}
@media (min-width:1100px){.dict-list{grid-template-columns:1fr 1fr!important}.dict-list .row:nth-child(odd){border-right:1px solid var(--line)!important}.dict-list .row:nth-child(2){border-top:0!important}}
.app{padding-left:var(--safe-l);padding-right:var(--safe-r)}
.tabbar,.session{padding-left:var(--safe-l);padding-right:var(--safe-r)}

</style>

function dayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

const BOX_DAYS = [0, 1, 3, 7, 14, 30];

function rec(w) { return (S.words[w.id] = Object.assign({ s: 0, due: 0, seen: 0, ok: 0, bad: 0 }, S.words[w.id])); }
function isDue(w) { const r = S.words[w.id]; return !!(r && r.seen && r.due <= Date.now()); }
function srsLearned(w) { const r = rec(w); r.seen = 1; r.s = Math.max(1, r.s || 0); r.due = dueIn(BOX_DAYS[1]); }

  const r = rec(w);
  if (ok) { if (r.due <= Date.now()) { r.s = Math.min(MAXBOX, Math.max(1, r.s || 0) + 1); r.due = dueIn(BOX_DAYS[r.s]); } }
  else { r.s = 1; r.due = dueIn(BOX_DAYS[1]); }
  r.seen = 1;
}
function dueWords() { return ITEMS.filter(isDue).sort((a, b) => ws(a).s - ws(b).s || ws(a).due - ws(b).due); }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function stagesFor(it) {

}
function reviewType(w) { const st = stagesFor(w), s = ws(w).s; return s <= 1 ? st[0] : st[Math.floor(Math.random() * st.length)]; }
function learnItem(w, fresh) { return { w, kind: "learn", fresh, stages: (fresh ? ["intro"] : []).concat(stagesFor(w)), i: 0, ready: 0, misses: 0 }; }
function revItem(w, tag) { return { w, kind: "rev", tag, stages: [reviewType(w)], i: 0, ready: 0, misses: 0 }; }
function startLesson(ui, li) {
  const words = UNITS[ui].lessons[li], inL = new Set(words.map(w => w.id));
  const due = dueWords().filter(w => !inL.has(w.id));
  const warm = due.slice(0, WARMUP);
  const older = shuffle(ITEMS.filter(w => ws(w).seen && !inL.has(w.id) && !isDue(w))).sort((a, b) => ws(a).s - ws(b).s);
  startSession({ mode: "lesson", ui, li, words, title: `${ui + 1}. ${UNITS[ui].title} · урок ${li + 1}`,
    items: [...warm.map(w => revItem(w, "warm")), ...words.map(w => learnItem(w, !ws(w).seen))],
    pool: [...due.slice(WARMUP, WARMUP + 8), ...older.slice(0, 12)] });
}
function startReview() {
  let words = dueWords().slice(0, 15), extra = false;
  if (words.length < 6) {
    const more = shuffle(ITEMS.filter(w => ws(w).seen && !words.includes(w))).sort((a, b) => ws(a).s - ws(b).s || ws(b).bad - ws(a).bad);
    extra = !words.length; words = words.concat(more.slice(0, 6 - words.length));
  }
  if (!words.length) { toast("Сначала пройдите хотя бы один урок"); return; }
  const rest = shuffle(ITEMS.filter(w => ws(w).seen && !words.includes(w))).slice(0, 6);
  startSession({ mode: "review", words, title: extra ? "Повторение слабых карточек" : "Повторение", items: shuffle(words).map(w => revItem(w, "rev")), pool: [], spare: rest });
}
// Пробная КР №1 по образцу «ДЕМО 1 КР МС»: 9 схем реакций → 3 «чем различить» → 3 цепочки
const EXAM_PARTS = [
  { n: 9, sec: "Задание 1 · схема реакции", f: w => w.unit <= 5 && ((w.k === "p" && w.cat === "prod") || w.k === "r"), st: w => w.k === "p" ? "fw" : "rt" },
  { n: 3, sec: "Задание 2 · чем различить", f: w => w.k === "p" && w.cat === "diff", st: () => "fw" },
  { n: 3, sec: "Задание 3 · цепочка превращений", f: w => w.unit <= 5 && w.k === "c", st: () => Math.random() < 0.5 ? "gap" : "ord" },
];
function examWeight(w) { const r = ws(w); return Math.random() * (1 + (r.seen ? (5 - r.s) + 1.5 * r.bad - 0.5 * r.ok : 1.5)) + (/^КР/.test(strip(w.q)) || w.src === "КР" ? 0.6 : 0); }
function startExam() {
  const pool = examPool(), words = [], items = [];
  EXAM_PARTS.forEach(p => {
    const cand = pool.filter(p.f).map(w => ({ w, k: examWeight(w) })).sort((a, b) => b.k - a.k);
    const pick = [], usedU = new Set();
    for (const c of cand) { if (pick.length >= p.n) break; if (!usedU.has(c.w.unit) || cand.length < 3 * p.n) { pick.push(c.w); usedU.add(c.w.unit); } }
    for (const c of cand) { if (pick.length >= p.n) break; if (!pick.includes(c.w)) pick.push(c.w); }
    pick.forEach(w => { const it = revItem(w, "exam"); it.stages = [p.st(w)]; it.sec = p.sec; it.ready = items.length; words.push(w); items.push(it); });
  });
  startSession({ mode: "exam", words, title: "Пробная КР №1 (08.12)", items, pool: [] });
}
function startSession(o) {
  SES = Object.assign(o, { step: -1, hist: [], log: [], done: 0, mistakes: 0, answered: 0, firstTry: 0, t0: Date.now(),
    wrongWords: new Set(), introduced: new Set(), srsDone: new Set(), extraUsed: new Set(), matched: false,
    known: new Set(ITEMS.filter(w => ws(w).seen).map(w => w.id)) });
  SES.queue = { get length() { return sesLeft(); } };
  $("#session").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  nextStep();
}
function matchCands() { return SES.words.filter(w => w.k === "p" && strip(w.q).length <= 60 && strip(w.a).length <= 50); }
function sesLeft() {
  if (!SES || !SES.items) return 0;
  return SES.items.reduce((a, it) => a + (it.done ? 0 : it.stages.length - it.i), 0) + (SES.mode === "lesson" && !SES.matched && matchCands().length >= 3 ? 1 : 0);
}
function recentIds(k = 2) { return SES.hist.slice(-k).flat(); }
function pickNext() {
  const t = SES.step, recent = recentIds();
  const open = SES.items.filter(it => !it.done), isIntro = it => it.stages[it.i] === "intro";
  const qs = open.filter(it => !isIntro(it));
  const ready = qs.filter(it => it.ready <= t && !recent.includes(it.w.id)).sort((a, b) => (b.retry ? 1 : 0) - (a.retry ? 1 : 0) || a.ready - b.ready || (a.kind === "rev" ? -1 : 1));
  if (ready.length) return ready[0];
  const intros = open.filter(isIntro), active = qs.filter(it => it.kind === "learn").length;
  const pool = (SES.pool || []).filter(w => !recent.includes(w.id));
  if (intros.length && active < BATCH && !(SES.lastT === "intro" && pool.length)) return intros[0];
  if (pool.length && qs.length) { const w = pool[0]; SES.pool.splice(SES.pool.indexOf(w), 1); return addItem(revItem(w, "fill")); }
  if (intros.length) return intros[0];
  // words already finished in this session / spare known cards get one more quick question
  const spare = SES.mode === "exam" ? [] : SES.items.filter(it => it.done && it.kind === "learn" && !SES.extraUsed.has(it.w.id) && !recent.includes(it.w.id)).map(it => it.w)
    .concat((SES.spare || []).filter(w => !SES.extraUsed.has(w.id) && !recent.includes(w.id)));
  if (qs.length && spare.length) { const w = spare[0]; SES.extraUsed.add(w.id); const it = revItem(w, "fill"); it.stages = [stagesFor(w)[0]]; return addItem(it); }
  // nothing is due yet: keep a wrong card's 3-task gap with a quick filler on an already finished card
  if (SES.mode !== "exam" && qs.some(it => it.retry) && (SES.fillers || 0) < 8) {
    const recent3 = recentIds(3), busy = new Set(qs.map(it => it.w.id));
    const fw = SES.items.filter(it => it.done && !it.retry && !recent3.includes(it.w.id) && !busy.has(it.w.id)).map(it => it.w);
    if (fw.length) { const w = fw[Math.floor(Math.random() * fw.length)]; SES.fillers = (SES.fillers || 0) + 1; const it = revItem(w, "fill"); it.stages = [stagesFor(w)[0]]; return addItem(it); }
  }
  const later = qs.filter(it => !recent.includes(it.w.id)).sort((a, b) => a.ready - b.ready);
  return later[0] || qs.sort((a, b) => a.ready - b.ready)[0] || null;
}
function addItem(it) { it.ready = SES.step; SES.items.push(it); return it; }
const VIEWS = {};
function nextStep() {
  if (!SES) return;
  SES.step++;
  let it = pickNext();
  if (!it && SES.mode === "lesson" && !SES.matched) {
    SES.matched = true;
    const seenA = new Set(), mw = shuffle(matchCands()).filter(w => { const k = strip(w.a); if (seenA.has(k)) return false; seenA.add(k); return true; }).slice(0, 5);
    if (mw.length >= 3) it = { match: true, ws: mw };
  }
  if (!it) { SES.step--; return finish(); }
  SES.item = it;
  const t = it.match ? "match" : it.stages[it.i];
  SES.cur = it.match ? { t, ws: it.ws } : { t, w: it.w, retry: !!it.retry, tag: it.kind === "rev" ? it.tag : "learn" };
  const ids = it.match ? it.ws.map(w => w.id) : [it.w.id];
  SES.hist.push(ids); SES.log.push({ step: SES.step, t, ids, tag: SES.cur.tag || "match", retry: !!it.retry });

function qLabel(st, dflt) {

  if (st.tag === "exam") return (SES.item && SES.item.sec) || "Контрольная";

}
function requeueWord(w) { const it = revItem(w, "fill"); it.stages = [stagesFor(w)[0]]; it.retry = true; it.ready = SES.step + 4; SES.items.push(it); }
function onAnswer(ok, w) {

  else if (!ok && SES.known.has(w.id)) { r.s = 1; r.due = Math.min(r.due, dueIn(1)); }
  if (ok) {
    it.i++; it.retry = false; it.ready = SES.step + GAP_OK;

  $("#session").innerHTML = `<div class="s-top"><button class="icon-btn" id="sClose" aria-label="Закрыть">${IC.x}</button><div class="s-prog"><i style="width:${SES.lastPct || 0}%"></i></div></div>
    <div class="s-body">${body}</div>${foot}`;
  requestAnimationFrame(() => { const i = $("#session .s-prog i"); if (i) i.style.width = pct + "%"; if (SES) SES.lastPct = pct; });

    <div class="ans">${fullAnswer(w)}</div></div></div>
    <button class="btn ${ok ? "" : "bad"}" id="contBtn">Дальше</button></div>`;

/* --- intro --- */
VIEWS.intro = st => {
  const w = st.w;
  const body = w.k === "p" ? `<div class="q">${w.q}</div><div class="ans">${w.a}</div>`
    : w.k === "r" ? `<div class="q">${w.q}</div><div class="ans">${rtLabel(w.a)}</div>`
    : w.k === "c" ? `<div class="q">${itemTitle(w)}</div>${chainHTML(w)}`
    : `<div class="q">${w.q}</div>${rankHTML(w)}`;
  sessionFrame(`<div class="q-kind">Новая карточка · ${KIND_LBL[w.k]}</div><div class="card intro"><span class="badge">${w.unit + 1}. ${esc(UNITS[w.unit].title)}</span>
    ${body}<div class="nt">${w.exp}</div><div class="srcl">Источник: ${esc(SRCN[w.src] || w.src)}</div></div>`,
    `<div class="s-foot" id="foot"><div class="in"><button class="btn" id="contBtn">Понятно</button></div></div>`);
  $("#contBtn").onclick = () => { const it = SES.item; it.i++; it.ready = SES.step + GAP_INTRO; SES.introduced.add(w.id); SES.done++; nextStep(); };
  $("#contBtn").focus({ preventScroll: true });

/* --- generic multiple choice --- */
function choice(st, kind, title, prompt, opts, correct) {
  const order = shuffle(opts.map((h, i) => ({ h, i })));
  sessionFrame(`<div class="q-kind">${qLabel(st, kind)}</div><h2 class="q-title">${title}</h2>${prompt}
    <div class="opts" id="opts">${order.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${j + 1}</span><span>${o.h}</span></button>`).join("")}</div>`,
    hintFoot("Выберите вариант" + (matchMedia("(hover:hover)").matches ? ` · клавиши 1–${order.length}` : "")));
  const box = $("#opts");
  box.dataset.ans = order.findIndex(o => o.i === correct);
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (box.classList.contains("locked")) return;
    box.classList.add("locked");
    const ok = order[+b.dataset.j].i === correct;
    box.querySelectorAll(".opt").forEach((x, j) => { if (order[j].i === correct) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
    feedback(ok, st.w);
  });
}
const qbox = (h, cls = "") => `<div class="card qbox ${cls}" style="padding:16px">${h}</div>`;
VIEWS.fw = st => { const w = st.w; choice(st, "Вспомните", "Выберите ответ", qbox(w.q), [w.a, ...sample(w.d, 3)], 0); };
VIEWS.rv = st => { const w = st.w; choice(st, "Обратный вопрос", "К чему относится этот ответ?", qbox(w.a), [w.q, ...sample(w.rd, 3)], 0); };
VIEWS.rt = st => {
  const w = st.w, others = sample(DATA.rtypes.filter(r => r.k !== w.a), 3).map(r => r.k);
  choice(st, "Тип реакции", "Какой это тип (механизм) реакции?", qbox(w.q, "eq"), [w.a, ...others].map(rtLabel), 0);
};
VIEWS.top = st => { const w = st.w; choice(st, "Сравнение", esc(strip(w.top)), qbox(w.q.replace(/\s*—\s*по возрастанию/, "").replace(/\s*\(по [^)]*\)/, "")), w.seq.slice(), w.seq.length - 1); };
VIEWS.gap = st => {
  const w = st.w, gi = 1 + Math.floor(Math.random() * (w.seq.length - 1));
  const near = ITEMS.filter(i => i.k === "c" && i !== w && Math.abs(i.unit - w.unit) <= 1).flatMap(i => i.seq).filter(n => !w.seq.includes(n));
  const others = sample([...new Set(near)], 3);
  if (others.length < 3) others.push(...sample(CHAIN_NODES.filter(n => !w.seq.includes(n) && !others.includes(n)), 3 - others.length));
  choice(st, "Цепочка", "Какое вещество пропущено?", `<div class="card qbox" style="padding:16px">${chainHTML(w, gi)}</div>`, [w.seq[gi], ...others], 0);

/* --- true / false --- */
function trueFalse(st, kind, stmt) {
  sessionFrame(`<div class="q-kind">${qLabel(st, kind)}</div><h2 class="q-title">Верно или неверно?</h2>
    <div class="card tf-stmt">${stmt.h}</div>
    <div class="opts" id="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-v="1"><span class="k">1</span><span>Верно</span></button><button class="opt" data-v="0"><span class="k">2</span><span>Неверно</span></button></div>`,
    hintFoot("Оцените утверждение"));
  const box = $("#opts");
  box.dataset.ans = stmt.truth ? 0 : 1;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (box.classList.contains("locked")) return;
    box.classList.add("locked");
    const v = b.dataset.v === "1", ok = v === stmt.truth;
    box.querySelectorAll(".opt").forEach(x => { if ((x.dataset.v === "1") === stmt.truth) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
    feedback(ok, st.w);
  });
}
VIEWS.tf = st => {
  const w = st.w, truth = Math.random() < 0.5, cand = truth ? w.a : sample(w.d, 1)[0];
  trueFalse(st, "Проверка", { truth, h: `<div class="lbl">Утверждение</div><div class="qbox" style="margin:0 0 6px;font-size:1.05rem">${w.q}</div><div style="font-size:1.15rem;font-weight:700;color:var(--lat)">→ ${cand}</div>` });
};
VIEWS.rtf = st => {
  const w = st.w, truth = Math.random() < 0.5, cand = truth ? w.a : sample(DATA.rtypes.filter(r => r.k !== w.a), 1)[0].k;
  trueFalse(st, "Тип реакции", { truth, h: `<div class="lbl">Реакция</div><div class="qbox eq" style="margin:0 0 10px">${w.q}</div><div>Механизм: ${rtLabel(cand)}</div>` });
};

/* --- ordering (chains, rankings) --- */
VIEWS.ord = st => {
  const w = st.w, n = w.seq.length;
  let pool = shuffle(w.seq.map((h, i) => ({ h, i })));
  for (let k = 0; k < 5 && pool.every((p, j) => p.i === j); k++) pool = shuffle(pool);
  const asc = w.k === "o" && !isSeqOrder(w);
  const title = w.k === "c" ? "Расставьте вещества цепочки по порядку" : asc ? "Расставьте по возрастанию" : "Расставьте по порядку";
  const sub = w.k === "c" ? `<div class="srcl" style="margin:0 0 6px">${itemTitle(w)}</div><div style="font-size:.95rem">Реагенты по порядку: ${w.reag.map((r, i) => `<b>${i + 1})</b> ${r}`).join("; ")}</div>`
    : `<div>${w.q}</div>${asc ? `<div class="srcl">Первым — наименьшее, последним — наибольшее</div>` : ""}`;
  sessionFrame(`<div class="q-kind">${qLabel(st, w.k === "c" ? "Цепочка превращений" : "Сравнение")}</div><h2 class="q-title">${title}</h2>
    <div class="card" style="padding:14px 16px;margin-bottom:14px">${sub}</div>
    <div class="order-ans" id="oans"></div><div class="order-pool" id="opool"></div>`,
    `<div class="s-foot" id="foot"><div class="in"><div class="row2"><button class="btn ghost" id="skipBtn">Не знаю</button><button class="btn" id="checkBtn" disabled>Проверить</button></div></div></div>`);

  SES.ordPool = pool;
  const draw = () => {
    $("#oans").innerHTML = ans.map((p, j) => `<button class="opt" data-a="${j}"><span class="num">${j + 1}</span><span>${p.h}</span></button>`).join("");
    $("#opool").innerHTML = pool.map((p, j) => ans.includes(p) ? "" : `<button class="opt" data-p="${j}"><span>${p.h}</span></button>`).join("");
    $("#oans").querySelectorAll(".opt").forEach(b => b.onclick = () => { if (locked) return; ans.splice(+b.dataset.a, 1); draw(); });
    $("#opool").querySelectorAll(".opt").forEach(b => b.onclick = () => { if (locked) return; ans.push(pool[+b.dataset.p]); draw(); });

  };
  let locked = false;
  const check = skipped => {
    if (locked) return; locked = true;

/* --- match round --- */
VIEWS.match = st => {
  const ws_ = st.ws, left = shuffle(ws_), right = shuffle(ws_);
  sessionFrame(`<div class="q-kind">Пары · закрепление</div><h2 class="q-title">Соедините пары</h2>
    <div class="match" id="mt"><div class="col">${left.map(w => `<button class="opt" data-id="${esc(w.id)}" data-side="l">${w.q}</button>`).join("")}</div>
    <div class="col">${right.map(w => `<button class="opt" data-id="${esc(w.id)}" data-side="r">${w.a}</button>`).join("")}</div></div>`,
    hintFoot("Нажмите вопрос слева, затем ответ справа"));
  let sel = { l: null, r: null }, leftN = ws_.length, errs = 0;
  $("#mt").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const side = b.dataset.side;
    if (sel[side]) sel[side].classList.remove("sel");
    if (sel[side] === b) { sel[side] = null; return; }
    sel[side] = b; b.classList.add("sel");
    if (sel.l && sel.r) {
      const a = sel.l, c = sel.r;
      if (a.dataset.id === c.dataset.id) {
        [a, c].forEach(x => { x.classList.remove("sel"); x.classList.add("right"); setTimeout(() => { x.classList.remove("right"); x.classList.add("gone"); }, 250); });
        leftN--;
      } else {
        errs++; SES.mistakes++;
        const ww = byId[a.dataset.id];
        if (!SES.items.some(it => !it.done && it.w === ww)) requeueWord(ww);
        SES.wrongWords.add(ww);
        [a, c].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong", "shake"); setTimeout(() => x.classList.remove("wrong", "shake"), 400); });
      }
      sel = { l: null, r: null };
      if (!leftN) setTimeout(() => {
        SES.answered++; SES.done++; if (!errs) SES.firstTry++; SES.item.done = true;
        const foot = $("#foot"); foot.className = "s-foot ok";
        foot.innerHTML = `<div class="in"><div class="fb"><div class="ic">${IC.check}</div><div><b>${errs ? "Все пары найдены" : "Отлично"}</b><div class="ans">${errs ? "Перепутанные карточки ещё встретятся" : "Без ошибок"}</div></div></div><button class="btn" id="contBtn">Дальше</button></div>`;
        $("#contBtn").onclick = nextStep; $("#contBtn").focus({ preventScroll: true });
      }, 300);
    }
  });
};

/* --- finish --- */
function finish() {
  SES.finished = true;
  const perfect = SES.mistakes === 0, isLesson = SES.mode === "lesson", isExam = SES.mode === "exam";
  const xp = isExam ? 15 : 10 + (perfect ? 5 : 0);
  const firstToday = addXp(xp);
  const acc = SES.answered ? Math.round(SES.firstTry / SES.answered * 100) : 100;
  if (isLesson) {
    const k = lessonKey(SES.ui, SES.li), prev = S.lessons[k];
    S.lessons[k] = { n: (prev ? prev.n : 0) + 1, at: Date.now() };
    SES.words.forEach(w => { if (!ws(w).seen) srsLearned(w); });
  }
  if (isExam) { const ok1 = SES.words.length - new Set([...SES.wrongWords].filter(w => SES.words.includes(w))).size; (S.exams = S.exams || []).push({ at: Date.now(), n: SES.words.length, acc: Math.round(ok1 / SES.words.length * 100) }); }
  save();
  const sec = Math.round((Date.now() - SES.t0) / 1000);
  const tm = sec >= 60 ? Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0") : sec + " с";
  const st = streak(), wrong = [...SES.wrongWords], nx = nextLesson(), dueN = dueWords().length;
  const examAcc = isExam ? S.exams[S.exams.length - 1].acc : 0;
  sessionFrame(`<div class="done"><div class="seal">${IC.check}</div>
    <h2>${isLesson ? "Урок пройден" : isExam ? "Контрольная пройдена" : "Повторение завершено"}</h2>
    <p>${esc(SES.title)}</p>
    <div class="done-stats">
      <div class="card stat"><b style="color:var(--accent)">+${xp}</b><span>XP${perfect ? " · без ошибок" : ""}</span></div>
      <div class="card stat"><b>${isExam ? examAcc : acc}%</b><span>${isExam ? "с первой попытки" : "точность"}</span></div>
      <div class="card stat"><b>${tm}</b><span>время</span></div>
    </div>
    <div class="muted" style="max-width:520px">${isLesson ? "Новые карточки вернутся на повторение завтра, потом через 3, 7 и 14 дней." : isExam ? `До контрольной: ${Math.max(0, daysToExam())} ${plural(Math.max(0, daysToExam()), "день", "дня", "дней")}. Ошибки попадут в повторение.` : (dueN ? `Ещё на повторение: ${itemsN(dueN)}` : "На сегодня всё повторено.")}</div>
    ${firstToday ? `<div class="streak-note">${IC.flame} Серия: ${st} ${plural(st, "день", "дня", "дней")}</div>` : `<div class="muted">Сегодня: ${todayXp()} / ${S.settings.goal} XP</div>`}
    ${wrong.length ? `<div class="card" style="width:100%;max-width:560px;text-align:left;padding:4px 0"><div class="hint" style="padding:10px 14px 4px">Карточки с ошибками — попадут в повторение</div>${wrong.map(w => `<div class="row"><div class="t">${fullAnswer(w)}</div></div>`).join("")}</div>` : ""}
    </div>`,
    `<div class="s-foot" id="foot"><div class="in"><div class="row2">${isLesson && nx ? `<button class="btn ghost" id="homeBtn">На главную</button><button class="btn" id="contBtn">Следующий урок</button>` : `<button class="btn" id="homeBtn">Продолжить</button>`}</div></div></div>`);
  $("#homeBtn").onclick = () => closeSession(true);
  const c = $("#contBtn");
  if (c) { c.onclick = () => { closeSession(true); startLesson(nx[0], nx[1]); }; c.focus({ preventScroll: true }); } else $("#homeBtn").focus({ preventScroll: true });
}

/* ---------- flashcards ---------- */
function startFlash(list) {
  if (!list.length) return;
  const order = shuffle(list).sort((a, b) => ws(a).s - ws(b).s).slice(0, 40);
  let i = 0, shown = false, known = 0;
  SES = { mode: "flash", queue: [], done: 0, words: order, finished: false };
  $("#session").classList.remove("hidden"); document.body.style.overflow = "hidden";
  const draw = () => {
    if (i >= order.length) { SES.finished = true; closeSession(true); toast(`Карточки: знаю ${known} из ${order.length}`); return; }
    const w = order[i];
    SES.done = i; SES.queue = new Array(order.length - i);
    const front = w.k === "c" ? itemTitle(w) : w.k === "r" ? `${w.q}<div class="tap" style="margin-top:8px">тип реакции?</div>` : w.q;
    sessionFrame(`<div class="flash"><div class="q-kind" style="text-align:center">Карточка ${i + 1} из ${order.length}</div>
      <div class="card fcard" id="fc"><div class="q">${front}</div>
      ${shown ? `<div class="ans">${ansHTML(w)}</div><div class="hint">${w.exp}</div>` : `<div class="tap">нажмите, чтобы увидеть ответ</div>`}</div></div>`,
      `<div class="s-foot" id="foot"><div class="in">${shown ? `<div class="row2"><button class="btn ghost" id="fNo" style="flex:1">Не знаю</button><button class="btn" id="fYes" style="flex:1">Знаю</button></div>` : `<button class="btn ghost" id="fShow">Показать ответ</button>`}</div></div>`);
    const reveal = () => { if (!shown) { shown = true; draw(); } };
    $("#fc").onclick = reveal;
    if (!shown) $("#fShow").onclick = reveal;
    else {
      $("#fYes").onclick = () => { rec(w).ok++; if (ws(w).seen) srsAnswer(w, true); else srsLearned(w); save(); known++; i++; shown = false; draw(); };
      $("#fNo").onclick = () => { rec(w).bad++; if (ws(w).seen) srsAnswer(w, false); save(); i++; shown = false; draw(); };
    }
  };
  draw();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!SES || $("#session").classList.contains("hidden")) return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { closeSession(false); return; }
  if (/^[1-5]$/.test(e.key)) { const b = document.querySelectorAll("#opts .opt")[+e.key - 1]; if (b) { b.click(); e.preventDefault(); } return; }
  if (e.key === "Enter" || e.key === " ") {
    const b = $("#contBtn") || $("#fShow") || $("#fYes") || ($("#checkBtn") && !$("#checkBtn").disabled ? $("#checkBtn") : null);
    if (b && document.activeElement !== b) { b.click(); e.preventDefault(); }
  }
});

/* ---------- PWA: service worker (offline cache + updates) ---------- */
const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
    let pending = false, reloaded = false;
    const reloadNow = () => { if (reloaded) return; reloaded = true; try { save(); } catch (e) {} location.reload(); };
    const tryReload = () => { if (pending && !SES) reloadNow(); };
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController) return; pending = true; tryReload(); });
    document.addEventListener("visibilitychange", () => { if (pending && document.hidden) reloadNow(); });
    document.addEventListener("click", () => setTimeout(tryReload, 0));
  });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
load(); applyTheme(); render();

</script>
</body>
</html>
